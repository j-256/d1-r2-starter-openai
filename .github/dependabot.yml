version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "02:00"
      timezone: "America/Chicago"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # eslint-config-next's bundled typescript-eslint does not support TypeScript 7
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # eslint-config-next's React plugin does not support ESLint 10
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "02:30"
      timezone: "America/Chicago"
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
